<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc"><title id="title">Repository context workflow</title><desc id="desc">Repository and a task or Git change enter RepoBound. Selected repository context can be explained, controlled and replayed before use by a coding agent.</desc><rect width="1000" height="220" rx="12" fill="#f8f6f1" stroke="#d4cbbd"/><g font-family="Segoe UI,Arial,sans-serif" fill="#211f1b" text-anchor="middle"><g stroke="#e7e1d7" fill="#fdfcf9"><rect x="24" y="48" width="235" height="124" rx="8"/><rect x="344" y="48" width="312" height="124" rx="8"/><rect x="741" y="48" width="235" height="124" rx="8"/></g><text x="142" y="91" font-size="22">Repository</text><text x="142" y="130" font-size="16" fill="#5f5a52">+ task / Git change</text><text x="500" y="86" font-size="25" fill="#a96818">RepoBound</text><text x="500" y="117" font-size="16">Selected repository context</text><text x="500" y="149" font-size="14" fill="#5f5a52">Explain · Control · Replay</text><text x="859" y="94" font-size="22">Coding agent</text><text x="859" y="128" font-size="14" fill="#5f5a52">Codex / Claude Code / Cursor</text><text x="300" y="117" font-size="34" fill="#a96818">→</text><text x="699" y="117" font-size="34" fill="#a96818">→</text></g></svg>
