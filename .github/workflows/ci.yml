name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Node 24.20 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run brand:core-freeze
      - run: npm run brand:audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm run package:smoke
      - run: npm run release:hardening
      - run: npm run benchmark:validate
      - run: npm run benchmark:smoke

  minimum-node:
    name: Minimum Node 24.15 / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run package:smoke
      - run: npm run release:hardening
      - run: npm run benchmark:validate
      - run: npm run benchmark:smoke

  benchmark-full:
    name: Full frozen benchmark / Ubuntu Node 24.20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm audit --json
      - run: npm run benchmark
      - run: node scripts/release-evidence-check.mjs
      - run: node .benchmark-dist/benchmarks/src/capsule-conformance.js conformance

  studio-browser:
    name: Studio browser and installed package / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run studio:e2e
      - run: npm run review:e2e
      - run: npm run v05:browser
      - run: npm run skill:validate
      - run: npm run launch:validate
      - run: npm run site:e2e
      - run: npm run brand:parity
      - run: npm run brand:state-compatibility
      - run: npm run review:benchmark
      - run: npm run package:smoke
        env:
          REPOBOUND_STUDIO_BROWSER: "1"
